<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT REUNION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/letter.css">
    <link rel="stylesheet" href="css/chapter.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background -->

    <canvas id="starCanvas"></canvas>

    <div class="nebula"></div>

    <div class="moon"></div>


    <!-- ==========================
         HERO
    =========================== -->

    <div class="hero">

        <h1 id="title"></h1>

        <p>
          Some hearts deserve another chance to rewrite what they couldn't before.
        </p>

        <button id="startBtn">
            Begin Journey
        </button>

    </div>


    <!-- Transition Overlay -->

    <div id="transitionOverlay"></div>



    <!-- ==========================
         LETTER SCENE
    =========================== -->

    <div id="letterScene">

        <div class="ambientGlow"></div>

        <div class="letterContainer">

            <div class="letter">

               <p class="letterDate" id="letterDate"></p>
                <h1 class="letterHeading">
                    For You
                </h1>

                <div class="paper">

                    <p id="typedText"></p>

                </div>

                <button id="continueBtn">
                    Continue →
                </button>

            </div>

        </div>

    </div>



    <!-- ==========================
         CHAPTER ONE
    =========================== -->

    <div id="chapterOne">

        <div class="chapterGlow"></div>

        <p class="chapterNumber">
            Chapter One
        </p>

        <h1 class="chapterTitle">
            The First Sunrise
        </h1>

        <p class="chapterSubtitle">
            Every ending quietly prepares the beginning of another story.
        </p>

        <div class="chapterDivider"></div>

        <p class="continueHint">
            Click anywhere to continue
        </p>

    </div>
    <!-- ==========================
     STORY SCENE
========================== -->

<section id="storyScene">

  <div class="storyContainer">

    <h1 class="confessionTitle">
        Confession
    </h1>

    <div class="storyLine"></div>

<div class="storyBody">

    <p id="line1" class="typeLine"></p>
    <p id="line2" class="typeLine"></p>
    <p id="line3" class="typeLine"></p>
    <p id="line4" class="typeLine"></p>
    <p id="line5" class="typeLine"></p>
    <p id="line6" class="typeLine"></p>
    <p id="line7" class="typeLine"></p>
    <p id="line8" class="typeLine"></p>
    <p id="line9" class="typeLine"></p>
    <p id="line10" class="typeLine"></p>
    <p id="line11" class="typeLine"></p>
    <p id="line12" class="typeLine"></p>
    <p id="line13" class="typeLine finalConfession"></p>
    <p id="line14" class="typeLine signatureText"></p>

</div>

</div>

</section>



    <!-- ==========================
         SCRIPTS
    =========================== -->

    <script src="script.js"></script>

    <script src="js/intro.js"></script>

    <script src="js/transition.js"></script>

    <script src="js/letter.js"></script>

    <script src="js/chapter.js"></script>

</body>
</html>
